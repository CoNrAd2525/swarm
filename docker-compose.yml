services:
  bbc-bot:
    build: .
    container_name: better_binance_claimer
    restart: always  # This ensures the bot restarts automatically if it crashes or the server reboots
    ports:
      - "5000:5000"  # Expose Dashboard
    volumes:
      - ./data:/app/data       # Mount persistent data directory
      - ./chrome_profile:/app/chrome_profile # Mount Chrome profile for cookies
      - .:/app                 # Mount source code (optional in prod, good for dev)
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
