name: Site Deploy

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment label"
        required: false
        default: "prod"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.environment != 'staging' }}
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Policy gate (secrets + Plaid readiness)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps (policy gate)
        run: npm ci --omit=dev || npm ci || npm install --omit=dev --no-audit --no-fund --no-package-lock
      - name: Run policy gate
        run: node scripts/policy-gate.mjs
      - name: Upload policy status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-status
          path: logs/security/policy-status.json

      - name: Render .env file
        run: |
          echo "OWNER=${{ github.repository_owner }}" > .env
          echo "PAYPAL_OWNER_EMAIL=${{ secrets.PAYPAL_OWNER_EMAIL }}" >> .env
          echo "OWNER_DASH_TOKEN=${{ secrets.OWNER_DASH_TOKEN }}" >> .env
          cat .env

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,.env"
          target: "${{ secrets.DEPLOY_PATH }}"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose pull
            docker compose up -d
            sleep 5
            curl -sSf http://localhost/health || (docker compose logs --tail=50; exit 1)
  deploy_staging:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging' }}
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Render .env file
        run: |
          echo "OWNER=${{ github.repository_owner }}" > .env
          echo "PAYPAL_OWNER_EMAIL=${{ secrets.STAGING_PAYPAL_OWNER_EMAIL }}" >> .env
          echo "OWNER_DASH_TOKEN=${{ secrets.OWNER_DASH_TOKEN }}" >> .env
          cat .env
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,.env"
          target: "${{ secrets.STAGING_DEPLOY_PATH }}"
          overwrite: true
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.STAGING_DEPLOY_PATH }}"
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose pull
            docker compose up -d
            sleep 5
            curl -sSf http://localhost/health || (docker compose logs --tail=50; exit 1)
