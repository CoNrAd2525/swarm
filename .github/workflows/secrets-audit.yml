name: Secrets Audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
      BASE44_SERVICE_TOKEN: ${{ secrets.BASE44_SERVICE_TOKEN }}
      BASE44_API_URL: ${{ secrets.BASE44_API_URL }}
      BASE44_SERVER_URL: ${{ secrets.BASE44_SERVER_URL }}
      BASE44_REVENUE_ENTITY: ${{ secrets.BASE44_REVENUE_ENTITY }}
      BASE44_PAYOUT_ENTITY: ${{ secrets.BASE44_PAYOUT_ENTITY }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
      PAYPAL_OWNER_EMAIL: ${{ secrets.PAYPAL_OWNER_EMAIL }}
      OWNER_DASH_TOKEN: ${{ secrets.OWNER_DASH_TOKEN }}
      SITE_PUBLIC_URL: ${{ secrets.SITE_PUBLIC_URL }}
      PUBLIC_WEBHOOK_BASE_URL: ${{ secrets.PUBLIC_WEBHOOK_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAID_ENV: ${{ secrets.PLAID_ENV }}
      PLAID_ALLOWED_PRODUCTS: ${{ secrets.PLAID_ALLOWED_PRODUCTS }}
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      PLAID_WEBHOOK_HMAC_SECRET: ${{ secrets.PLAID_WEBHOOK_HMAC_SECRET }}
      PLAID_WEBHOOK_SIGNATURE_SECRET: ${{ secrets.PLAID_WEBHOOK_SIGNATURE_SECRET }}
      PLAIDBOX_KEY: ${{ secrets.PLAIDBOX_KEY }}
      ENVBOX_KEY: ${{ secrets.ENVBOX_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_STATIC_PROJECT_NAME: ${{ secrets.VERCEL_STATIC_PROJECT_NAME }}
      VERCEL_PROXY_PROJECT_NAME: ${{ secrets.VERCEL_PROXY_PROJECT_NAME }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_TEST_TO: ${{ secrets.SMTP_TEST_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          node - <<'NODE'
          const required = [
            "BASE44_APP_ID",
            "BASE44_SERVICE_TOKEN",
            "PAYPAL_CLIENT_ID",
            "PAYPAL_CLIENT_SECRET",
            "PAYPAL_WEBHOOK_ID",
            "OWNER_DASH_TOKEN",
            "SITE_PUBLIC_URL",
            "PUBLIC_WEBHOOK_BASE_URL",
            "SUPABASE_URL",
            "SUPABASE_ANON_KEY",
            "SUPABASE_SERVICE_ROLE_KEY",
            "VERCEL_TOKEN",
          ];
          const optional = [
            "BASE44_API_URL",
            "BASE44_SERVER_URL",
            "BASE44_REVENUE_ENTITY",
            "BASE44_PAYOUT_ENTITY",
            "PAYPAL_OWNER_EMAIL",
            "PLAID_ENV",
            "PLAID_ALLOWED_PRODUCTS",
            "PLAID_CLIENT_ID",
            "PLAID_SECRET",
            "PLAID_WEBHOOK_HMAC_SECRET",
            "PLAID_WEBHOOK_SIGNATURE_SECRET",
            "PLAIDBOX_KEY",
            "ENVBOX_KEY",
            "VERCEL_TEAM_ID",
            "VERCEL_ORG_ID",
            "VERCEL_STATIC_PROJECT_NAME",
            "VERCEL_PROXY_PROJECT_NAME",
            "SMTP_HOST",
            "SMTP_PORT",
            "SMTP_USER",
            "SMTP_PASS",
            "SMTP_FROM",
            "SMTP_TEST_TO",
          ];
          function isPlaceholder(value) {
            if (value == null) return true;
            const v = String(value).trim();
            if (!v) return true;
            if (/^\s*<\s*YOUR_[A-Z0-9_]+\s*>\s*$/i.test(v)) return true;
            if (/^\s*YOUR_[A-Z0-9_]+\s*$/i.test(v)) return true;
            if (/^\s*(REPLACE_ME|CHANGEME|TODO)\s*$/i.test(v)) return true;
            return false;
          }
          function present(name) {
            const v = process.env[name];
            return !isPlaceholder(v);
          }
          const report = {};
          for (const k of [...required, ...optional]) report[k] = present(k);
          const missing = required.filter((k) => !report[k]);
          process.stdout.write(
            `${JSON.stringify(
              {
                ok: missing.length === 0,
                missing_required: missing,
                report,
              },
              null,
              2,
            )}\n`,
          );
          NODE
