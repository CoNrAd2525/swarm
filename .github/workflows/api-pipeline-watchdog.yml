name: API Pipeline Watchdog
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watchdog:
    runs-on: ubuntu-latest
    concurrency:
      group: api-pipeline-watchdog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm i
      - name: API pipeline snapshot
        run: |
          mkdir -p rank/output/site-data
          node ./scripts/report-system-snapshot.mjs > rank/output/site-data/api_pipeline_snapshot.json || true
      - name: Owner routing validation
        run: |
          mkdir -p rank/output/site-data
          node ./scripts/validate-owner-routing-env.mjs > rank/output/site-data/owner_routing_check.json || true
      - name: Readiness ping
        run: npm run live:readiness:ping
      - name: Upload watchdog artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-pipeline-watchdog
          path: |
            rank/output/site-data/api_pipeline_snapshot.json
            rank/output/site-data/owner_routing_check.json
      - name: Commit changes
        run: |
          if [ "${{ vars.AUTOCOMMIT_ENABLE || 'false' }}" != "true" ]; then
            echo "Autocommit disabled."
            exit 0
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: api pipeline watchdog updates"
            git push
          else
            echo "No changes to commit."
          fi
