name: Branch Protection (Master)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: branch-protection-master
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies (with retries)
        run: |
          set -euo pipefail
          n=0
          until [ $n -ge 3 ]; do
            if npm ci --no-audit --no-fund 2>/dev/null; then break; fi
            n=$((n+1)); echo "Install retry ($n)..."; sleep 5
          done
      - name: Apply master branch protection
        env:
          GITHUB_ADMIN_TOKEN: ${{ secrets.GITHUB_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_ADMIN_TOKEN:-}" ]; then
            echo '{"ok":false,"error":"missing_secret:GITHUB_ADMIN_TOKEN"}'
            exit 0
          fi
          node ./scripts/apply-branch-protection.mjs --repo "${{ github.repository }}" --branch master || echo "branch-protection apply failed but continuing"
