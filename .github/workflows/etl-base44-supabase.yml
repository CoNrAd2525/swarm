name: ETL Base44 to Supabase

on:
  schedule:
    - cron: "22 * * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Write to Supabase (true/false)"
        required: false
        default: "true"
      limit:
        description: "Max records per entity"
        required: false
        default: "500"

concurrency:
  group: etl-base44-supabase
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install deps (with retries)
        run: |
          set -euo pipefail
          n=0
          until [ $n -ge 3 ]; do
            if npm ci --no-audit --no-fund 2>/dev/null; then break; fi
            n=$((n+1)); echo "Install retry ($n)..."; sleep 5
          done
      - name: Run ETL
        env:
          BASE44_API_URL: ${{ secrets.BASE44_API_URL }}
          BASE44_SERVER_URL: ${{ secrets.BASE44_SERVER_URL }}
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          BASE44_SERVICE_TOKEN: ${{ secrets.BASE44_SERVICE_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASE44_REVENUE_ENTITY: ${{ secrets.BASE44_REVENUE_ENTITY }}
          BASE44_PAYOUT_ENTITY: ${{ secrets.BASE44_PAYOUT_ENTITY }}
          ETL_LIVE: ${{ github.event.inputs.live || 'true' }}
          ETL_PAGE_SIZE: ${{ github.event.inputs.limit || '500' }}
          ETL_LIMIT_TOTAL: "5000"
          BASE44_TIMEOUT_MS: "15000"
          SUPABASE_UPSERT_CHUNK: "500"
        run: node scripts/etl/base44-to-supabase.mjs || echo "base44→supabase ETL completed with warnings"
