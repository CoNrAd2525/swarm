name: Finance Diagnose (Hands-Free)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "10 * * * *"
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[finance-diagnose]')
    runs-on: ubuntu-latest
    env:
      BANK_RECONCILE_ENABLE: "true"
      SITE_PUBLIC_URL: ${{ secrets.SITE_PUBLIC_URL }}
      BASE44_SERVICE_TOKEN: ${{ secrets.BASE44_SERVICE_TOKEN }}
      BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
      BASE44_API_URL: ${{ secrets.BASE44_API_URL }}
      BASE44_SERVER_URL: ${{ secrets.BASE44_SERVER_URL }}
      BASE44_REVENUE_ENTITY: ${{ secrets.BASE44_REVENUE_ENTITY }}
      BASE44_PAYOUT_ENTITY: ${{ secrets.BASE44_PAYOUT_ENTITY }}
      PLAID_ENV: ${{ secrets.PLAID_ENV }}
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      PLAIDBOX_KEY: ${{ secrets.PLAIDBOX_KEY }}
      PLAID_OWNER_ACCESS_TOKEN: ${{ secrets.PLAID_OWNER_ACCESS_TOKEN }}
      PLAID_ACCESS_TOKEN: ${{ secrets.PLAID_ACCESS_TOKEN }}
      OWNER_NOTIFY_EMAIL: ${{ secrets.SECONDARY_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Prepare output folder
        run: mkdir -p exports/reports
      - name: Owner routing env validation
        run: node ./scripts/validate-owner-routing-env.mjs | tee exports/reports/owner_routing_env_last.json || true
      - name: Plaid readiness
        run: node ./scripts/plaid-preflight.mjs | tee exports/reports/plaid_preflight_last.json || true
      - name: Bank reconciliation (Plaid) - auto confirm
        run: node ./scripts/auto-confirm-bank-settlements.mjs | tee exports/reports/bank_reconcile_last.json || true
      - name: Queue owner notifications
        run: node ./scripts/email/queue-from-communications.mjs || true
      - name: Upload finance reports
        uses: actions/upload-artifact@v4
        with:
          name: finance-diagnose-${{ github.run_id }}
          path: exports/reports/*.json
      - name: Commit generated reports/communications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(finance): diagnostics update"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No diagnostics artifacts to commit."
          fi
