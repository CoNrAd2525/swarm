name: Bank Reconciliation (Hands-Free)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 * * * *"
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: bank-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[bank-reconcile]'))
    runs-on: ubuntu-latest
    env:
      AUTOCOMMIT_ENABLE: ${{ vars.AUTOCOMMIT_ENABLE || 'false' }}
      BANK_RECONCILE_ENABLE: "true"
      SITE_PUBLIC_URL: ${{ secrets.SITE_PUBLIC_URL }}
      BASE44_SERVICE_TOKEN: ${{ secrets.BASE44_SERVICE_TOKEN }}
      BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
      BASE44_API_URL: ${{ secrets.BASE44_API_URL }}
      BASE44_SERVER_URL: ${{ secrets.BASE44_SERVER_URL }}
      BASE44_REVENUE_ENTITY: ${{ secrets.BASE44_REVENUE_ENTITY }}
      BASE44_PAYOUT_ENTITY: ${{ secrets.BASE44_PAYOUT_ENTITY }}
      PLAID_ENV: ${{ secrets.PLAID_ENV }}
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      PLAIDBOX_KEY: ${{ secrets.PLAIDBOX_KEY }}
      PLAID_OWNER_ACCESS_TOKEN: ${{ secrets.PLAID_OWNER_ACCESS_TOKEN }}
      PLAID_ACCESS_TOKEN: ${{ secrets.PLAID_ACCESS_TOKEN }}
      OWNER_NOTIFY_EMAIL: ${{ secrets.SECONDARY_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies (with retries)
        run: |
          set -euo pipefail
          n=0
          until [ $n -ge 3 ]; do
            if npm ci --no-audit --no-fund 2>/dev/null; then break; fi
            n=$((n+1)); echo "Install retry ($n)..."; sleep 5
          done
      - name: Plaid readiness (best effort)
        run: |
          set -euo pipefail
          mkdir -p exports/reports
          node ./scripts/plaid-preflight.mjs > exports/reports/plaid_preflight_last.json 2>&1 || echo "plaid-preflight failed but continuing"
      - name: Auto-confirm pending external settlements
        run: |
          set -euo pipefail
          mkdir -p exports/reports
          node ./scripts/auto-confirm-bank-settlements.mjs > exports/reports/bank_reconcile_last.json 2>&1 || echo "auto-confirm-bank-settlements failed but continuing"
      - name: Finance state snapshot (Base44)
        run: |
          set -euo pipefail
          mkdir -p exports/reports
          node ./scripts/report-finance-state.mjs > exports/reports/finance_state_last.json 2>&1 || echo "report-finance-state failed but continuing"
      - name: Queue owner notifications (best effort)
        run: node ./scripts/email/queue-from-communications.mjs || echo "queue-from-communications failed but continuing"
      - name: Commit generated reports/communications
        run: |
          set -euo pipefail
          if [ "${AUTOCOMMIT_ENABLE}" != "true" ]; then
            echo "Autocommit disabled via AUTOCOMMIT_ENABLE (default false)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ALLOWED=(
            "exports/reports"
            "data/notifications"
            "data/ops"
            "data/finance"
            "data/base44_export"
            "data/swarm"
            "exports/communications"
          )
          for p in "${ALLOWED[@]}"; do
            if [ -e "$p" ]; then git add -- "$p" 2>/dev/null || true; fi
          done
          git --no-pager diff --cached --stat || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(finance): bank reconciliation updates" || true
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "No reconciliation artifacts to commit."
          fi
