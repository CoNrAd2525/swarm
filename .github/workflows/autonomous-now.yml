name: Autonomous Now
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - release
permissions:
  actions: write
jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[autonomous-now]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Autonomous Scheduler
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/autonomous-scheduler.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
