name: Vercel Proxy Deploy

on:
  push:
    branches:
      - release
    paths:
      - 'vercel.json'
      - 'api/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Vercel CLI
        run: npm i -g vercel
      - name: Ensure Vercel project uses repo root (best effort)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROXY_PROJECT_NAME }}
          VERCEL_GIT_REPO: CoNrAd2525/swarm
          VERCEL_ROOT_DIRECTORY: .
          VERCEL_GIT_BRANCH: release
        run: node scripts/vercel-update-project-repo.mjs || true
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROXY_PROJECT_NAME: ${{ secrets.VERCEL_PROXY_PROJECT_NAME }}
        run: |
          NAME="${VERCEL_PROXY_PROJECT_NAME:-rwc-proxy}"
          if [ -n "$VERCEL_TEAM_ID" ]; then
            npx vercel pull --environment=production --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_ID" || true
            npx vercel deploy --prod --yes --name "$NAME" --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_ID"
          else
            npx vercel pull --environment=production --yes --token "$VERCEL_TOKEN" || true
            npx vercel deploy --prod --yes --name "$NAME" --token "$VERCEL_TOKEN"
          fi
