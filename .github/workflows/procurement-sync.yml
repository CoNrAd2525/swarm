name: Procurement Sync (Supabase)

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  issues: read
  contents: read

concurrency:
  group: procurement-sync-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: contains(github.event.issue.labels.*.name, 'procurement')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies (with retries)
        run: |
          set -euo pipefail
          n=0
          until [ $n -ge 3 ]; do
            if npm ci --no-audit --no-fund 2>/dev/null; then break; fi
            n=$((n+1)); echo "Install retry ($n)..."; sleep 5
          done
      - name: Sync to Supabase Storage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROCUREMENT_BUCKET: ${{ secrets.SUPABASE_PROCUREMENT_BUCKET }}
          MIRROR_SUPABASE_BUCKET: ${{ secrets.MIRROR_SUPABASE_BUCKET }}
        run: node ./scripts/ci/sync_procurement_to_supabase.mjs || echo "procurement sync failed but continuing"
