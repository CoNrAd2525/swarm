name: CI Guardrails
on:
  pull_request:
  push:
    branches: [main, master, release]
permissions:
  contents: read
concurrency:
  group: ci-guardrails-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies (with retries)
        run: |
          set -euo pipefail
          n=0
          until [ $n -ge 3 ]; do
            if npm ci --no-audit --no-fund 2>/dev/null; then break; fi
            n=$((n+1)); echo "Install retry ($n)..."; sleep 5
          done
      - name: Guardrails
        run: node ./scripts/ci-guardrails.mjs || echo "ci-guardrails reported issues (non-fatal for PR visibility)"
