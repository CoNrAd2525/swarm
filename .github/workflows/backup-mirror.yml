name: Backup + Mirror (Cloud)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 */6 * * *"

permissions:
  contents: read

concurrency:
  group: backup-mirror-cloud
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE44_API_URL: ${{ secrets.BASE44_API_URL }}
      BASE44_SERVER_URL: ${{ secrets.BASE44_SERVER_URL }}
      BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
      BASE44_SERVICE_TOKEN: ${{ secrets.BASE44_SERVICE_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      MIRROR_SUPABASE_BUCKET: ${{ secrets.MIRROR_SUPABASE_BUCKET }}
      ENVBOX_KEY: ${{ secrets.ENVBOX_KEY }}
      PLAIDBOX_KEY: ${{ secrets.PLAIDBOX_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies (with retries)
        run: |
          set -euo pipefail
          n=0
          until [ $n -ge 3 ]
          do
            if npm ci --no-audit --no-fund 2>/dev/null; then break; fi
            n=$((n+1))
            echo "Retrying install ($n)..."
            sleep 5
          done
      - name: Export Base44 entities
        run: |
          set -euo pipefail
          if [ -z "$BASE44_APP_ID" ] || [ -z "$BASE44_SERVICE_TOKEN" ]; then
            echo "No Base44 credentials set — skipping export-full-base44."
          else
            node ./scripts/export-full-base44.mjs || echo "export-full-base44 failed but continuing"
          fi
      - name: Local snapshot
        run: node ./scripts/backup-project-state.mjs || echo "backup-project-state failed but continuing"
      - name: Recovery + mirror sync
        run: node ./scripts/recovery-daemon.mjs --once || echo "recovery-daemon failed but continuing"
      - name: Swarm sync health snapshot
        run: npm run swarm:monitor:sync || echo "swarm:monitor:sync failed but continuing"
      - name: Package backup bundle
        run: |
          set -euo pipefail
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          echo "TS=$ts" >> "$GITHUB_ENV"
          mkdir -p backups
          tar -czf "backups/backup_mirror_${ts}.tgz" \
            data/base44_export \
            data/finance \
            data/swarm \
            data/mirror-sites.json \
            doomsday-vault \
            backups \
            logs/mirror-status.json \
            rank/output/site-data 2>/dev/null || true
      - name: Upload bundle to Supabase Storage
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.MIRROR_SUPABASE_BUCKET != '' }}
        run: |
          set -euo pipefail
          bucket="${MIRROR_SUPABASE_BUCKET}"
          base="${SUPABASE_URL}/storage/v1"
          curl -fSL --connect-timeout 10 --max-time 60 -sS -X POST "${base}/bucket" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data "{\"id\":\"${bucket}\",\"name\":\"${bucket}\",\"public\":false}" >/dev/null 2>&1 || true
          object_path="backup/${GITHUB_REF_NAME}/${TS}/backup_mirror.tgz"
          curl -fSL --connect-timeout 15 --max-time 300 -sS -X PUT "${base}/object/${bucket}/${object_path}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"backups/backup_mirror_${TS}.tgz" || echo "supabase upload failed but continuing"
      - name: Upload backups (artifact)
        uses: actions/upload-artifact@v5
        with:
          name: backup-mirror-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            data/base44_export/**
            data/finance/**
            data/swarm/**
            data/mirror-sites.json
            doomsday-vault/**
            backups/**
            logs/mirror-status.json
            rank/output/site-data/**
