name: RealWorldCerts Next CI
on:
  pull_request:
    paths:
      - "apps/realworldcerts-next/**"
      - ".github/workflows/realworldcerts-next-ci.yml"
  push:
    branches: [main, master, release]
    paths:
      - "apps/realworldcerts-next/**"
      - ".github/workflows/realworldcerts-next-ci.yml"
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/realworldcerts-next
jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
