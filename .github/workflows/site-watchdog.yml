name: Site Watchdog

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: site-watchdog
      cancel-in-progress: true
    env:
      SITE_PUBLIC_URL: ${{ secrets.SITE_PUBLIC_URL }}
      PAYPAL_OWNER_EMAIL: ${{ secrets.PAYPAL_OWNER_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      
      - name: Install
        run: npm ci || npm i
      
      - name: Health Check (Smoke Test)
        if: ${{ env.SITE_PUBLIC_URL != '' }}
        run: node ./scripts/site-smoke-test.mjs

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Health check failed for ${SITE_PUBLIC_URL}"
          echo "Would send alert to younesdgc@gmail.com"
