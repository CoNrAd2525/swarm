name: Refresh External Catalogs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-catalogs
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (if any)
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm i
          else
            echo "No package.json present; skipping install."
          fi

      - name: Refresh ingestion outputs
        env:
          CATALOG_CSV_DIR: ${{ github.workspace }}/rank_mirror
        run: |
          node ./scripts/ingest-external-catalogs.mjs
      - name: Refresh scrapes dataset
        run: |
          node ./scripts/refresh-scrapes.mjs
      - name: Inject Google SSO extension
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_WEB }}
        run: |
          if [ -z "${GOOGLE_CLIENT_ID:-}" ]; then
            echo "Missing GOOGLE_CLIENT_ID_WEB; skipping SSO injection."
            exit 0
          fi
          node ./scripts/inject-google-sso.mjs

      - name: Commit and push if changed
        run: |
          if [ "${{ vars.AUTOCOMMIT_ENABLE || 'false' }}" != "true" ]; then
            echo "Autocommit disabled."
            exit 0
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git config user.email "actions@github.com"
            git config user.name "github-actions[bot]"
            git add -A
            git commit -m "chore: hourly refresh catalogs, scrapes and SSO injection"
            git push
          else
            echo "No changes to commit."
          fi
