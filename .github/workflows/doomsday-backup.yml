name: Doomsday Backup

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 0'

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ env.DOOMSDAY_ARCHIVE_PASSPHRASE != '' }}
    environment: doomsday
    concurrency:
      group: doomsday-backup
      cancel-in-progress: true
    env:
      DOOMSDAY_ARCHIVE_PASSPHRASE: ${{ secrets.DOOMSDAY_ARCHIVE_PASSPHRASE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DOOMSDAY_BUCKET: ${{ secrets.SUPABASE_DOOMSDAY_BUCKET }}
      GITLAB_MIRROR_URL: ${{ secrets.GITLAB_MIRROR_URL }}
      CODEBERG_MIRROR_URL: ${{ secrets.CODEBERG_MIRROR_URL }}
      DOOMSDAY_PRESIGNED_PUT_URL: ${{ secrets.DOOMSDAY_PRESIGNED_PUT_URL }}
      DOOMSDAY_PRESIGNED_PUT_URL_SHA256: ${{ secrets.DOOMSDAY_PRESIGNED_PUT_URL_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all refs
        run: git fetch --prune --tags origin '+refs/heads/*:refs/heads/*'

      - name: Verify encryption secret
        run: |
          if [ -z "${DOOMSDAY_ARCHIVE_PASSPHRASE}" ]; then
            echo "Missing DOOMSDAY_ARCHIVE_PASSPHRASE"
            exit 0
          fi

      - name: Build archive
        run: |
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          echo "TS=$ts" >> "$GITHUB_ENV"
          tar -czf "khwarizmian_swarm_${ts}.tgz" khwarizmian_swarm

      - name: Encrypt archive
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass pass:"$DOOMSDAY_ARCHIVE_PASSPHRASE" -in "khwarizmian_swarm_${TS}.tgz" -out "khwarizmian_swarm_${TS}.tgz.enc"
          sha256sum "khwarizmian_swarm_${TS}.tgz.enc" | awk '{print $1}' > "khwarizmian_swarm_${TS}.tgz.enc.sha256"

      - name: Upload to Presigned URL
        if: ${{ env.DOOMSDAY_PRESIGNED_PUT_URL != '' && env.DOOMSDAY_PRESIGNED_PUT_URL_SHA256 != '' }}
        run: |
          curl -sS -X PUT -H "Content-Type: application/octet-stream" --data-binary @"khwarizmian_swarm_${TS}.tgz.enc" "${DOOMSDAY_PRESIGNED_PUT_URL}"
          curl -sS -X PUT -H "Content-Type: text/plain" --data-binary @"khwarizmian_swarm_${TS}.tgz.enc.sha256" "${DOOMSDAY_PRESIGNED_PUT_URL_SHA256}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: doomsday-${{ env.TS }}
          name: Doomsday Backup ${{ env.TS }}
          files: |
            khwarizmian_swarm_${{ env.TS }}.tgz.enc
            khwarizmian_swarm_${{ env.TS }}.tgz.enc.sha256

      - name: Upload to Supabase Storage
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          bucket="${SUPABASE_DOOMSDAY_BUCKET:-doomsday}"
          base="${SUPABASE_URL}/storage/v1"
          curl -sS -X POST "${base}/bucket" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data "{\"id\":\"${bucket}\",\"name\":\"${bucket}\",\"public\":false}" >/dev/null 2>&1 || true

          object_path="swarm/${GITHUB_REF_NAME}/${TS}/khwarizmian_swarm.tgz.enc"
          curl -sS -X PUT "${base}/object/${bucket}/${object_path}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"khwarizmian_swarm_${TS}.tgz.enc"

          sha_path="swarm/${GITHUB_REF_NAME}/${TS}/khwarizmian_swarm.tgz.enc.sha256"
          curl -sS -X PUT "${base}/object/${bucket}/${sha_path}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: text/plain" \
            --data-binary @"khwarizmian_swarm_${TS}.tgz.enc.sha256"

      - name: Mirror to GitLab
        if: ${{ env.GITLAB_MIRROR_URL != '' }}
        run: |
          git remote add gitlab "${GITLAB_MIRROR_URL}"
          git push gitlab --mirror

      - name: Mirror to Codeberg
        if: ${{ env.CODEBERG_MIRROR_URL != '' }}
        run: |
          git remote add codeberg "${CODEBERG_MIRROR_URL}"
          git push codeberg --mirror
